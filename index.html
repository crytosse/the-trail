      <h1>Alex Moliski — Storytelling Rooted in Exploration</h1>
      <p>I'm a creative strategist, editorial manager, filmmaker, and photographer focused on exploration, adventure, and outdoor storytelling. I'm the Editorial Manager at Backcountry, where I lead editorial direction across Backcountry, Competitive Cyclist, and SteepAndCheap. This portfolio is best experienced with JavaScript enabled — here's the short version:</p>
      <h2>Highlights</h2>
      <ul>
        <li><strong>Backcountry (2019–present)</strong> — grew from Writer to Editorial Manager; lead a team of copywriters and own messaging across site, email, social, paid, SMS, catalog, retail, and video for campaigns reaching an audience in the tens of millions.</li>
        <li><strong>A Trail Tale</strong> — Webby award-winning interactive website about hiking the Appalachian Trail; I composed the original score. <a href="https://atrailtale.com">atrailtale.com</a></li>
        <li><strong>The Last Letters of Theodore Roosevelt</strong> — a full-length book I wrote and researched. <a href="https://www.amazon.com/Last-Letters-Theodore-Roosevelt-1918-1919/dp/B0C9SPDZ22">Available on Amazon</a></li>
        <li><strong>Photography</strong> — approaching 500 million views across Unsplash and Pexels; Unsplash Photo of the Year Runner-Up (2025); 114+ Pexels homepage features.</li>
        <li><strong>Adventure Alex</strong> — my independently produced YouTube channel (3,100+ subscribers, 500K+ views). <a href="https://www.youtube.com/@alexmoliski">youtube.com/@alexmoliski</a></li>
        <li><strong>Freelance</strong> — copywriting and brand voice for Dickies, HYER, and Gnarly Nutrition.</li>
        <li><strong>Herd Hub</strong> — a full internal platform I built solo with AI.</li>
      </ul>
      <h2>Contact</h2>
      <p>Email <a href="mailto:Alex@moliski.net">Alex@moliski.net</a> ·

         <a href="https://www.youtube.com/@alexmoliski">YouTube</a></p>
    </div>
